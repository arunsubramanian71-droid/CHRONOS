# Automatic build on the three operating systems the specification names (NFR-14). It has NEVER been run: this repository has no
# remote (a deliberate decision, see IMPLEMENTATION_STATUS.md), so this file only becomes active if the repository is ever published.
name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (all eight modules)
        run: mvn -ntp package
      - name: Flagship demonstration (AD-1 to AD-6, KA scenarios; exit code 0 means every check passed)
        run: java -jar chronos-cli/target/chronos.jar --data chronos-data demo
